<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Multiplayer Game</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 12px;
      max-width: 380px;
      margin: 40px auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h2 { margin-top: 0; font-size: 22px; }
    p { color: #aaa; font-size: 14px; }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #333;
      font-size: 15px;
    }
    input { background: #2a2a2a; color: #fff; }
    input:focus { outline: none; border-color: #008cba; }
    button {
      background: #008cba;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #005f73; }
    #gameCanvas {
      background: #0a0a0a;
      border: 2px solid #333;
      border-radius: 8px;
      display: block;
      margin: 20px auto;
    }
    .hidden { display: none; }
    .error { color: #ff6b6b; font-size: 14px; margin-top: 10px; }
    .status { color: #888; font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- STEP 1: Registration Form -->
  <div id="authSection" class="card">
    <h2>Register Account</h2>
    <p>Enter your details to receive an email verification code.</p>
    <input type="text" id="regUsername" placeholder="Username" />
    <input type="email" id="regEmail" placeholder="Real Email Address" />
    <button id="sendBtn" onclick="requestCode()">Send Verification Code</button>
    <p id="authStatus" class="status"></p>
    <p id="authError" class="error"></p>
  </div>

  <!-- STEP 2: Email Verification Code Entry -->
  <div id="verifySection" class="card hidden">
    <h2>Enter Verification Code</h2>
    <p>Check your email inbox for your 6-digit code.</p>
    <input type="text" id="verifyCode" placeholder="6-digit code" maxLength="6" />
    <button onclick="submitCode()">Verify & Play</button>
    <p id="verifyError" class="error"></p>
  </div>

  <!-- STEP 3: Global Multiplayer World -->
  <div id="gameSection" class="hidden">
    <h2 id="welcomeMsg"></h2>
    <p>Use WASD or Arrow Keys to move globally with other players in real time.</p>
    <canvas id="gameCanvas" width="700" height="400"></canvas>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let socket;
    let currentUser = "";
    let userEmail = "";
    let players = {};
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Automatically wake up Render server on page load
    window.addEventListener("DOMContentLoaded", () => {
      const statusEl = document.getElementById("authStatus");
      statusEl.innerText = "Connecting to server... (may take ~1 min if waking up)";
      
      fetch("/api/request-code", { method: "HEAD" })
        .then(() => { statusEl.innerText = "Connected to server!"; })
        .catch(() => { statusEl.innerText = ""; });
    });

    async function requestCode() {
      const username = document.getElementById("regUsername").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const errEl = document.getElementById("authError");
      const statusEl = document.getElementById("authStatus");
      const sendBtn = document.getElementById("sendBtn");

      errEl.innerText = "";
      if (!username || !email) {
        errEl.innerText = "Please enter both username and email.";
        return;
      }

      sendBtn.disabled = true;
      statusEl.innerText = "Sending verification email...";

      try {
        const res = await fetch("/api/request-code", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email })
        });

        const data = await res.json();
        sendBtn.disabled = false;

        if (!res.ok) {
          errEl.innerText = data.error;
          statusEl.innerText = "";
        } else {
          currentUser = username;
          userEmail = email;
          document.getElementById("authSection").classList.add("hidden");
          document.getElementById("verifySection").classList.remove("hidden");
        }
      } catch (err) {
        sendBtn.disabled = false;
        statusEl.innerText = "";
        errEl.innerText = "Failed to connect to server. Try again in a moment.";
      }
    }

    async function submitCode() {
      const code = document.getElementById("verifyCode").value.trim();
      const errEl = document.getElementById("verifyError");
      errEl.innerText = "";

      if (!code) {
        errEl.innerText = "Please enter the verification code.";
        return;
      }

      try {
        const res = await fetch("/api/verify-code", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: userEmail, code })
        });

        const data = await res.json();
        if (!res.ok) {
          errEl.innerText = data.error;
        } else {
          document.getElementById("verifySection").classList.add("hidden");
          document.getElementById("gameSection").classList.remove("hidden");
          document.getElementById("welcomeMsg").innerText = `Logged in as: ${currentUser}`;
          startMultiplayer();
        }
      } catch (err) {
        errEl.innerText = "Verification failed. Please try again.";
      }
    }

    function startMultiplayer() {
      socket = io();

      // Join global game room
      socket.emit("player:join", { username: currentUser });

      socket.on("game:state", (serverPlayers) => {
        players = serverPlayers;
        requestAnimationFrame(render);
      });

      socket.on("player:joined", (player) => {
        players[player.id] = player;
      });

      socket.on("player:moved", (data) => {
        if (players[data.id]) {
          players[data.id].x = data.x;
          players[data.id].y = data.y;
        }
      });

      socket.on("player:left", (id) => {
        delete players[id];
      });

      // Keyboard Controls
      window.addEventListener("keydown", (e) => {
        const myPlayer = players[socket.id];
        if (!myPlayer) return;

        let moved = false;
        const speed = 5;

        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { myPlayer.x -= speed; moved = true; }
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { myPlayer.x += speed; moved = true; }
        if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") { myPlayer.y -= speed; moved = true; }
        if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") { myPlayer.y += speed; moved = true; }

        if (moved) {
          // Clamp inside canvas bounds
          myPlayer.x = Math.max(15, Math.min(canvas.width - 15, myPlayer.x));
          myPlayer.y = Math.max(15, Math.min(canvas.height - 15, myPlayer.y));
          socket.emit("player:move", { x: myPlayer.x, y: myPlayer.y });
        }
      });
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let id in players) {
        const p = players[id];

        // Draw Player Circle
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
        ctx.fill();

        // Draw Player Username
        ctx.fillStyle = "#ffffff";
        ctx.font = "12px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(p.username, p.x, p.y - 20);
      }

      requestAnimationFrame(render);
    }
  </script>
</body>
</html>
